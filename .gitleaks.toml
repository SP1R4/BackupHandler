# Gitleaks configuration — extends the default ruleset.
# The allowlist below suppresses false positives on documentation examples
# of the qsafe CLI, whose --key-file/--pub-file flags with placeholder
# filenames (backup.key, ops.pub, ...) trip the generic-api-key rule.

[extend]
useDefault = true

[allowlist]
description = "qsafe CLI examples in docs use --key-file <name>.key placeholders, not secrets"
regexTarget = "line"
regexes = [
    '''--key-file [\w./-]+(\.key|\.bin)''',
    '''--pub-file [\w./-]+(\.pub|\.bin)''',
]
